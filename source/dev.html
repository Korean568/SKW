<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKW · 해상 반격 (WebGPU)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05080c;color:#cfe8f5;font:14px/1.5 'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#fatal{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(#0c1a26,#04070b);z-index:99;user-select:text}
#fatal>div{max-width:580px;margin:16px;padding:26px 30px;border:1px solid #2a4a5e;border-radius:10px;background:#0a141dcc}
#fatal h1{margin:0 0 12px;font-size:22px;color:#ff8a5c}#fatal code{background:#132330;padding:1px 6px;border-radius:4px;color:#8fd}#fatal li{margin:4px 0}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="ui"></div>
<script src="core.js"></script>
<script>
// 개발용 하네스: ?mods=ocean,fx (또는 all) 로 실제 모듈을 고르고 나머지는 stubs.js 가 채움
{ const want = (G.params.get('mods') || '').split(',');
  for (const m of ['gpu', 'sky', 'post', 'ocean', 'mesh', 'models', 'fx', 'audio', 'i18n', 'game', 'people', 'cabin', 'fps', 'village', 'story2', 'palace', 'story3', 'ruins', 'story4', 'story', 'desktop', 'touch', 'en1', 'en2', 'en3', 'en4', 'enui', 'ennav'])
    if (want.includes(m) || want.includes('all')) document.write('<script src="mod_' + m + '.js"><\/script>');
  document.write('<script src="stubs.js"><\/script><script>G.boot()<\/script>'); }
</script>
</body>
</html>
