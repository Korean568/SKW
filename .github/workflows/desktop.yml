# PC 다운로드판 (Electron) 빌드 — 수동 실행 전용 (Actions 탭 → "Desktop builds" → Run workflow)
#
# 1) Windows · macOS · Linux 러너에서 desktop/ 을 빌드해 zip 등을 워크플로 아티팩트로 올린다.
# 2) 저장소 시크릿 BUTLER_API_KEY 가 있을 때만 itch.io 에 butler 로 올린다.
#    올릴 곳은 저장소 변수 ITCH_USER (itch.io 사용자 이름), ITCH_GAME (기본 second-korean-wars).
#    자세한 설명: desktop/README-itch.md
# 버전: 파일 이름 · itch.io 버전 · Releases 이름은 desktop/package.json 의 skwLabel (보이는 번호, 예 0.13),
#       Releases 태그는 version (내부 번호, 예 1.3.0 — 릴리스마다 올라가 겹치지 않음). 규칙: README-itch.md "버전 번호"
name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      push_to_itch:
        description: "BUTLER_API_KEY 시크릿이 있으면 itch.io 에도 올리기"
        type: boolean
        default: true
      release:
        description: "GitHub Releases 에도 올리기 (기본 끔 — PC판은 itch.io 에서만 배포)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (${{ matrix.target }})
        run: npm run dist:${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: second-korean-wars-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz

  # GitHub Releases 에 올리기: 저장소 Releases 페이지에 로그인 없이 내려받을 수 있는 링크가 생긴다
  release:
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/package.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Version
        id: v
        run: |
          echo "v=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "l=$(node -p "require('./desktop/package.json').skwLabel")" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.v }}
          name: Second Korean Wars PC ${{ steps.v.outputs.l }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: artifacts/*
          body: |
            Second Korean Wars (제 2차 한국전쟁) PC 다운로드판 ${{ steps.v.outputs.l }}

            - Windows: SecondKoreanWars-${{ steps.v.outputs.l }}-win-x64.zip (압축을 풀고 Second Korean Wars.exe 실행) 또는 -portable.exe (바로 실행)
            - macOS: -mac-arm64.zip (Apple 실리콘) / -mac-x64.zip (인텔). 처음 열 때 우클릭 → 열기
            - Linux: .AppImage 또는 .tar.gz (안 켜지면 --no-sandbox)

            WebGPU 를 지원하는 그래픽 카드와 최신 드라이버가 필요합니다 (Windows 10/11 DX12, macOS 13+, Linux Vulkan).

  itch:
    needs: build
    if: ${{ inputs.push_to_itch }}
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME || 'second-korean-wars' }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "BUTLER_API_KEY 시크릿이 없어 itch.io 업로드를 건너뜁니다."; exit 0; fi
          if [ "${ITCH_TARGET%%/*}" = "" ]; then
            # ITCH_USER 변수가 없으면 API 키의 주인 이름을 itch.io 에 물어 쓴다
            # itch.io 가 잠깐 "요청이 너무 많음"(429)을 돌려줄 때가 있어 몇 번 기다렸다 다시 묻는다
            U=""
            for i in 1 2 3 4 5 6; do
              U=$(curl -fsS "https://itch.io/api/1/$BUTLER_API_KEY/me" 2>/dev/null | jq -r '.user.username // empty' 2>/dev/null || true)
              [ -n "$U" ] || U=$(curl -fsS -H "Authorization: Bearer $BUTLER_API_KEY" https://api.itch.io/profile 2>/dev/null | jq -r '.user.username // empty' 2>/dev/null || true)
              [ -n "$U" ] && break
              echo "itch.io 사용자 이름 확인 재시도 ($i)"; sleep $((i * 10))
            done
            if [ -z "$U" ]; then echo "::error::itch.io 사용자 이름을 알 수 없습니다. 저장소 변수 ITCH_USER 를 설정하세요"; exit 1; fi
            echo "ITCH_TARGET=$U/${ITCH_TARGET#*/}" >> "$GITHUB_ENV"
            echo "itch.io 대상: $U/${ITCH_TARGET#*/}"
          fi

      - uses: actions/checkout@v4
        if: env.BUTLER_API_KEY != ''
        with:
          sparse-checkout: desktop/package.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          path: artifacts
          merge-multiple: true

      - name: Install butler
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler && butler/butler -V

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          set -e
          # 파일 이름 · itch 에 보이는 버전 = skwLabel (예: 0.13)
          V=$(node -p "require('./desktop/package.json').skwLabel")
          B=butler/butler
          $B push artifacts/SecondKoreanWars-$V-win-x64.zip      "$ITCH_TARGET:windows"   --userversion "$V"
          # 압축 풀 필요 없는 exe 한 파일 (포터블). butler 가 파일 하나를 받지 않으면 exe 만 든 폴더로 올린다
          EXE=artifacts/SecondKoreanWars-$V-win-x64-portable.exe
          $B push "$EXE" "$ITCH_TARGET:windows-portable" --userversion "$V" || { mkdir -p portable && cp "$EXE" portable/ && $B push portable "$ITCH_TARGET:windows-portable" --userversion "$V"; }
          $B push artifacts/SecondKoreanWars-$V-mac-arm64.zip    "$ITCH_TARGET:mac-arm64" --userversion "$V"
          $B push artifacts/SecondKoreanWars-$V-mac-x64.zip      "$ITCH_TARGET:mac-x64"   --userversion "$V"
          # Linux: tar.gz 를 풀어 실행 권한과 .itch.toml 이 맨 위에 있는 폴더째로 올린다
          mkdir -p linux && tar -xzf artifacts/SecondKoreanWars-$V-linux-x64.tar.gz -C linux
          $B push "linux/$(ls linux | head -n1)" "$ITCH_TARGET:linux" --userversion "$V"
          $B status "$ITCH_TARGET"
