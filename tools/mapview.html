<!doctype html><html><head><meta charset="utf-8"><title>Map viewer</title>
<style>body{margin:0;overflow:hidden;background:#222}#i{position:fixed;top:0;left:0;color:#fff;font:14px monospace;background:#000a;padding:6px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="i"></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const q=new URLSearchParams(location.search);const file=q.get('f');
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x8899aa);s.add(new THREE.HemisphereLight(0xffffff,0x444444,2));const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(30,60,20);s.add(d);
const c=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,1000);const top=q.get('top');
c.position.set(...(q.get('cam')||'0,120,0.01').split(',').map(Number));const o=new OrbitControls(c,r.domElement);o.target.set(...(q.get('tgt')||'0,0,0').split(',').map(Number));o.update();
s.add(new THREE.GridHelper(120,12,0xff0000,0xffff00));const ax=new THREE.AxesHelper(10);ax.position.y=20;s.add(ax);
new GLTFLoader().load(file,g=>{s.add(g.scene);if(q.get('hide'))g.scene.getObjectByName(q.get('hide')).visible=false;window.done=true;});
const ray=new THREE.Raycaster();addEventListener('click',e=>{ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},c);const h=ray.intersectObjects(s.children,true).find(h=>h.object.type==='Mesh');if(h)i.textContent=h.point.toArray().map(v=>v.toFixed(1)).join(', ')});
(function a(){requestAnimationFrame(a);r.render(s,c)})();
</script></body></html>
